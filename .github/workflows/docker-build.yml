name: Build Docker Container

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  repository_dispatch:

jobs:
  build:
    # Skip forked PRs; allow push and in-repo PRs only.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Cache CORSIKA tarball
      id: cache-corsika
      uses: actions/cache@v3
      with:
        path: container/corsika-77550.tar.gz
        key: corsika-77550-${{ hashFiles('container/Dockerfile') }}

    - name: Download CORSIKA if not cached
      if: steps.cache-corsika.outputs.cache-hit != 'true'
      env:
        CORSIKA_TARBALL_URL: ${{ secrets.CORSIKA_TARBALL_URL }}
        CORSIKA_TARBALL_RESOLVE: ${{ secrets.CORSIKA_TARBALL_RESOLVE }}
      run: |
        cd container
        CLEAN_TARBALL_URL="$(printf '%s' "${CORSIKA_TARBALL_URL}" | tr -d '\r\n')"
        if [ -z "$CLEAN_TARBALL_URL" ]; then
          echo "ERROR: CORSIKA_TARBALL_URL secret not set"
          exit 1
        fi
        if [[ "$CLEAN_TARBALL_URL" != http* ]]; then
          echo "ERROR: CORSIKA_TARBALL_URL must be http(s)"
          exit 1
        fi
        echo "Mirror URL length: ${#CLEAN_TARBALL_URL}"
        echo "Downloading CORSIKA tarball from mirror URL"
        CURL_OPTS=(-fL --retry 3 --retry-delay 5 -o corsika-77550.tar.gz)
        if [ -n "$CORSIKA_TARBALL_RESOLVE" ]; then
          CURL_OPTS+=(--resolve "$CORSIKA_TARBALL_RESOLVE")
        fi
        curl "${CURL_OPTS[@]}" -- "$CLEAN_TARBALL_URL"
        
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Build PANOSETI Docker image
      env:
        CORSIKA_USER: ${{ secrets.CORSIKA_USER }}
        CORSIKA_PASSWORD: ${{ secrets.CORSIKA_PASSWORD }}
      run: |
        cd container
        make build IMAGE_NAME=panoseti IMAGE_TAG=test
        
    - name: Quick CORSIKA test with CORSIKA example
      run: |
        cd container
        make test IMAGE_NAME=panoseti IMAGE_TAG=test
        
    - name: Test CORSIKA with PANOSETI example
      run: |
        cd container
        make ci-example-test IMAGE_NAME=panoseti IMAGE_TAG=test

    - name: Generate example PNGs
      run: |
        mkdir -p container/test_output
        docker run --rm \
          -v "$PWD/simulation-tools:/opt/panoseti/simulation-tools" \
          -v "$PWD/simulation-tools/example:/opt/panoseti/example" \
          -v "$PWD/container/test_output:/output" \
          -w /opt/panoseti/simulation-tools \
          panoseti:test \
          bash -lc 'cp /opt/panoseti/example/example.root ./example.root && root -l -b -q "run_example.C(0,true,\"/output/example\")"'
        
    - name: Upload CORSIKA logs
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: corsika-test-logs
        path: container/test_output/
        retention-days: 7
