name: Build Docker Container

on:
  push:
    branches: [ docker ]
  workflow_dispatch:
  repository_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Cache CORSIKA tarball
      id: cache-corsika
      uses: actions/cache@v3
      with:
        path: container/corsika-77550.tar.gz
        key: corsika-77550-${{ hashFiles('container/Dockerfile') }}
        
    - name: Download CORSIKA if not cached
      if: steps.cache-corsika.outputs.cache-hit != 'true'
      env:
        CORSIKA_USER: ${{ secrets.CORSIKA_USER }}
        CORSIKA_PASSWORD: ${{ secrets.CORSIKA_PASSWORD }}
      run: |
        if [ -z "$CORSIKA_USER" ] || [ -z "$CORSIKA_PASSWORD" ]; then
          echo "ERROR: CORSIKA_USER and CORSIKA_PASSWORD secrets not set"
          exit 1
        fi
        cd container
        wget --user="$CORSIKA_USER" --password="$CORSIKA_PASSWORD" \
          https://web.iap.kit.edu/corsika/download/corsika-v7750/corsika-77550.tar.gz
        
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Build PANOSETI Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./container
        push: false
        tags: panoseti:test
        cache-from: type=gha
        cache-to: type=gha,mode=max
        
    - name: Run container tests
      run: |
        docker run --rm panoseti:test bash -c "root-config --version && corsikaIOreader --help"
        
    - name: Quick CORSIKA test with CORSIKA example
      run: |
        cd container
        docker run --rm panoseti:test bash -c "cd /opt/panoseti/corsika-77550/run && timeout 30 ./corsika77550Linux_QGSII_urqmd < all-inputs 2>&1 | tail -20"
        
    - name: Test CORSIKA with PANOSETI example
      run: |
        cd container
        mkdir -p test_output
        docker run --rm \
          -v $(pwd)/test_output:/output \
          -w /opt/panoseti/corsika-77550/run \
          panoseti:test \
          bash -c "./corsika77550Linux_QGSII_urqmd < /opt/panoseti/example/example.inp 2>&1 > /output/corsika.log || true" && \
        ls -lh /output/DAT* /output/CER* 2>/dev/null || echo "No CORSIKA output files created" && \
        tail -50 /output/corsika.log
        
    - name: Upload CORSIKA logs
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: corsika-test-logs
        path: container/test_output/
        retention-days: 7